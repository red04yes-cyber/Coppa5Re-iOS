name: Build Coppa dei 5 Re for Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "windows_app/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [ main, ui/redesign-c5r-desktop ]
    paths:
      - "windows_app/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_app/requirements.txt
      - name: Download and prepare bundled Stockfish 19
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "stockfish-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "stockfish-extract"
          Invoke-WebRequest -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $engine = Get-ChildItem $extract -Recurse -File | Where-Object { $_.Extension -eq ".exe" -and $_.Name -match "stockfish" } | Select-Object -First 1
          if (-not $engine) { throw "Eseguibile Stockfish Windows non trovato nell'archivio ufficiale" }
          $target = "windows_app/stockfish"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $engine.FullName (Join-Path $target "stockfish.exe") -Force
          # Stockfish 19 Windows universal ships as a self-contained executable; no separate NNUE file is required.
          & (Join-Path $target "stockfish.exe") "quit"
          if ($LASTEXITCODE -ne 0) { throw "Stockfish non si avvia sul runner Windows" }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/official-stockfish/Stockfish/sf_19/Copying.txt" -OutFile (Join-Path $target "COPYING.txt")
          @"
          Stockfish 19 (sf_19), official Windows x86-64 universal release.
          Source code and exact release: https://github.com/official-stockfish/Stockfish/tree/sf_19
          License: GNU General Public License v3. The full license is in COPYING.txt.
          "@ | Set-Content (Join-Path $target "SOURCE.txt") -Encoding UTF8
          Get-ChildItem $target | Format-Table Name,Length
      - name: Test bundled Stockfish UCI without console window
        run: |
          python -c "import chess, chess.engine, subprocess; si=subprocess.STARTUPINFO(); si.dwFlags|=subprocess.STARTF_USESHOWWINDOW; si.wShowWindow=subprocess.SW_HIDE; e=chess.engine.SimpleEngine.popen_uci('windows_app/stockfish/stockfish.exe',timeout=12,cwd='windows_app/stockfish',creationflags=subprocess.CREATE_NO_WINDOW,startupinfo=si); info=e.analyse(chess.Board(),chess.engine.Limit(depth=3)); assert info.get('score') is not None; e.quit(); print('Stockfish UCI OK without visible console')"
      - name: Test persistent Stockfish service without console popups
        env:
          QT_QPA_PLATFORM: offscreen
        run: python windows_app/stockfish_service_smoke.py
      - name: Check Python syntax
        run: python -m compileall -q windows_app
      - name: Smoke test Qt, chess and tournament draw
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import chess; from PySide6.QtWidgets import QApplication; from windows_app.main import MainWindow, make_random_schedule, validate_schedule, DEFAULT_GAMES; app=QApplication([]); assert len(list(chess.Board().legal_moves)) == 20; validate_schedule(DEFAULT_GAMES); [validate_schedule(make_random_schedule()) for _ in range(100)]; window=MainWindow(); assert len(window.standings()) == 5; window.close(); print('Qt, chess, schedule generator and desktop UI OK')"
      - name: Verify Windows result visibility and local persistence
        env:
          QT_QPA_PLATFORM: offscreen
        run: python windows_app/results_visibility_smoke.py
      - name: Verify redesigned desktop panels
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from windows_app.main import MainWindow; app=QApplication([]); w=MainWindow(); print('DIAG',len(w.podium_cards),len(w.odds_rows),len(w.calendar_round_bars),hasattr(w,'audit_events_layout'),len(w.profile_tiles),len(w.compare_tiles),w._page_keys,hasattr(w,'notification_button'),w.health_check(),flush=True); assert len(w.podium_cards)==3; assert len(w.odds_rows)==5; assert len(w.calendar_round_bars)==5; assert hasattr(w,'audit_events_layout'); assert len(w.profile_tiles)==4; assert len(w.compare_tiles)==2; assert len(w._page_keys)==19 and 'incidents' in w._page_keys and 'communications' in w._page_keys and 'history' in w._page_keys; assert hasattr(w,'notification_button'); assert not any(x[0]=='ERRORE' for x in w.health_check()); w.refresh_all(); print('AFTER_REFRESH',w.dashboard_progress.minimum(),w.dashboard_progress.maximum(),w.dashboard_progress.value(),flush=True); assert w.dashboard_progress.value()>=0; print('PLAYER_REFRESH',flush=True); w.refresh_player_profile(); print('COMPARE_REFRESH',flush=True); w.refresh_compare(); print('OPENINGS_REFRESH',flush=True); w.refresh_openings(); print('BADGE_REFRESH',flush=True); w.refresh_notification_badge(); w.close(); print('Dashboard, podium, calendar, odds, playoffs, audit and pro tools OK')"
      - name: Test odds and streaming controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from windows_app.main import MainWindow; app=QApplication([]); w=MainWindow(); base=w.odds(n=1200); assert abs(sum(v[0] for v in base.values())-1)<0.01; assert abs(sum(v[1] for v in base.values())-4)<0.01; w.results['R1-M1']='1-0'; assert w.odds(n=1200)!=base; w.open_broadcast(); assert not w.broadcast.isFullScreen(); assert all(c.board.interactive for c in w.live_cards); assert all(not c.board.interactive for c in w.broadcast.cards); w.broadcast.close(); w.close(); print('odds and streaming OK')"
      - name: Test C5R tournament rules, PGN and recovery
        env:
          QT_QPA_PLATFORM: offscreen
        run: python windows_app/tournament_regression_smoke.py
      - name: Build standalone EXE
        shell: pwsh
        run: |
          $stockfishPath = (Resolve-Path "windows_app/stockfish").Path
          $assetsPath = (Resolve-Path "windows_app/assets").Path
          pyinstaller --noconfirm --clean --onefile --windowed --name Coppa5Re --add-data "$stockfishPath;stockfish" --add-data "$assetsPath;assets" --distpath dist --workpath build/windows --specpath build/windows windows_app/main.py
      - name: Verify executable
        run: |
          if (!(Test-Path "dist/Coppa5Re.exe")) { throw "Coppa5Re.exe non trovato" }
          Get-Item "dist/Coppa5Re.exe" | Format-List Name,Length
      - name: Verify resources embedded in the one-file EXE
        run: python windows_app/bundle_archive_smoke.py
      - name: Add C5R logo and Stockfish notices to distribution
        shell: pwsh
        run: |
          Copy-Item "windows_app/stockfish/COPYING.txt" "dist/Stockfish-COPYING.txt" -Force
          Copy-Item "windows_app/stockfish/SOURCE.txt" "dist/Stockfish-SOURCE.txt" -Force
          Copy-Item "windows_app/assets/c5r-logo.svg" "dist/C5R-logo.svg" -Force
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Coppa5Re-Windows-EXE
          path: dist/*
          if-no-files-found: error
          retention-days: 30
