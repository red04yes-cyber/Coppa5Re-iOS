name: Build Coppa dei 5 Re for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "windows_app/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_app/requirements.txt
      - name: Download and prepare bundled Stockfish 19
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "stockfish-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "stockfish-extract"
          Invoke-WebRequest -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $engine = Get-ChildItem $extract -Recurse -File | Where-Object { $_.Extension -eq ".exe" -and $_.Name -match "stockfish" } | Select-Object -First 1
          if (-not $engine) { throw "Eseguibile Stockfish Windows non trovato nell'archivio ufficiale" }
          $target = "windows_app/stockfish"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $engine.FullName (Join-Path $target "stockfish.exe") -Force
          $nets = Get-ChildItem $extract -Recurse -File -Filter "*.nnue"
          if (-not $nets) { throw "Rete NNUE Stockfish non trovata nell'archivio" }
          foreach ($net in $nets) { Copy-Item $net.FullName $target -Force }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/official-stockfish/Stockfish/sf_19/Copying.txt" -OutFile (Join-Path $target "COPYING.txt")
          @"
          Stockfish 19 (sf_19), official Windows x86-64 universal release.
          Source code and exact release: https://github.com/official-stockfish/Stockfish/tree/sf_19
          License: GNU General Public License v3. The full license is in COPYING.txt.
          "@ | Set-Content (Join-Path $target "SOURCE.txt") -Encoding UTF8
          Get-ChildItem $target | Format-Table Name,Length
      - name: Check Python syntax
        run: python -m compileall -q windows_app/main.py
      - name: Smoke test Qt, chess and tournament draw
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import chess; from PySide6.QtWidgets import QApplication; from windows_app.main import MainWindow, make_random_schedule, validate_schedule, DEFAULT_GAMES; app=QApplication([]); assert len(list(chess.Board().legal_moves)) == 20; validate_schedule(DEFAULT_GAMES); [validate_schedule(make_random_schedule()) for _ in range(100)]; window=MainWindow(); assert len(window.standings()) == 5; print('Qt, chess, schedule generator and desktop UI OK')"
      - name: Test odds and streaming controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from windows_app.main import MainWindow; app=QApplication([]); w=MainWindow(); base=w.odds(n=1200); assert abs(sum(v[0] for v in base.values())-1)<0.01; assert abs(sum(v[1] for v in base.values())-4)<0.01; w.results['R1-M1']='1-0'; assert w.odds(n=1200)!=base; w.open_broadcast(); assert not w.broadcast.isFullScreen(); assert all(c.board.interactive for c in w.live_cards); assert all(not c.board.interactive for c in w.broadcast.cards); w.broadcast.close(); w.close(); print('odds and streaming OK')"
      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Coppa5Re --add-data "windows_app/stockfish;stockfish" --add-data "windows_app/assets;assets" --distpath dist --workpath build/windows --specpath build/windows windows_app/main.py
      - name: Verify executable
        run: |
          if (!(Test-Path "dist/Coppa5Re.exe")) { throw "Coppa5Re.exe non trovato" }
          Get-Item "dist/Coppa5Re.exe" | Format-List Name,Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Coppa5Re-Windows-EXE
          path: dist/Coppa5Re.exe
          if-no-files-found: error
          retention-days: 30
