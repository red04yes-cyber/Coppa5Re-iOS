name: Build Coppa dei 5 Re for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "windows_app/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_app/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q windows_app/main.py
      - name: Smoke test Qt, chess and tournament draw
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import chess; from PySide6.QtWidgets import QApplication; from windows_app.main import MainWindow, make_random_schedule, validate_schedule, DEFAULT_GAMES; app=QApplication([]); assert len(list(chess.Board().legal_moves)) == 20; validate_schedule(DEFAULT_GAMES); [validate_schedule(make_random_schedule()) for _ in range(100)]; window=MainWindow(); assert len(window.standings()) == 5; print('Qt, chess, schedule generator and desktop UI OK')"
      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Coppa5Re --distpath dist --workpath build/windows --specpath build/windows windows_app/main.py
      - name: Sign executable (when a trusted certificate is configured)
        if: ${{ env.C5R_SIGNING_CERT_BASE64 != '' && env.C5R_SIGNING_CERT_PASSWORD != '' }}
        env:
          C5R_SIGNING_CERT_BASE64: ${{ secrets.C5R_SIGNING_CERT_BASE64 }}
          C5R_SIGNING_CERT_PASSWORD: ${{ secrets.C5R_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "c5r-signing.pfx"
          try {
            $bytes = [Convert]::FromBase64String($env:C5R_SIGNING_CERT_BASE64)
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\\10\\bin"
            $signTool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match '\\\\x64\\\\signtool.exe        run: |
          if (!(Test-Path "dist/Coppa5Re.exe")) { throw "Coppa5Re.exe non trovato" }
          Get-Item "dist/Coppa5Re.exe" | Format-List Name,Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Coppa5Re-Windows-EXE
          path: dist/Coppa5Re.exe
          if-no-files-found: error
          retention-days: 30
 } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK signtool.exe non trovato" }
            & $signTool.FullName sign /f $pfxPath /p $env:C5R_SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/Coppa5Re.exe"
            if ($LASTEXITCODE -ne 0) { throw "Firma digitale non riuscita (exit code $LASTEXITCODE)" }
            & $signTool.FullName verify /pa /v "dist/Coppa5Re.exe"
            if ($LASTEXITCODE -ne 0) { throw "Verifica della firma digitale non riuscita" }
          }
          finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }
      - name: Note when no signing certificate is configured
        if: ${{ env.C5R_SIGNING_CERT_BASE64 == '' || env.C5R_SIGNING_CERT_PASSWORD == '' }}
        run: Write-Host "Certificato non configurato: l'EXE viene prodotto senza firma digitale."
      - name: Verify executable
        run: |
          if (!(Test-Path "dist/Coppa5Re.exe")) { throw "Coppa5Re.exe non trovato" }
          Get-Item "dist/Coppa5Re.exe" | Format-List Name,Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Coppa5Re-Windows-EXE
          path: dist/Coppa5Re.exe
          if-no-files-found: error
          retention-days: 30
